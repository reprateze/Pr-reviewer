name: PR Reviewer AI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar API do PR Reviewer AI
        env:
          REVIEWER_API_URL: ${{ secrets.REVIEWER_API_URL }}
        run: |
          if [ -z "$REVIEWER_API_URL" ]; then
            echo "REVIEWER_API_URL não configurado — pulando (normal neste repositório-fonte, onde este arquivo é só o template pra copiar)."
            exit 0
          fi

          curl -X POST "$REVIEWER_API_URL/review" \
            -H "Content-Type: application/json" \
            -d '{
              "owner": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "pr_number": ${{ github.event.pull_request.number }},
              "head_ref": "${{ github.event.pull_request.head.sha }}"
            }'

# Observações para configuração:
# 1. REVIEWER_API_URL é a URL onde o backend (FastAPI) está rodando
#    (ex: um deploy no Render/Railway/servidor próprio), configurada como
#    Secret no repositório em Settings > Secrets and variables > Actions.
# 2. O backend precisa ter GITHUB_TOKEN e LLM_API_KEY configurados nele mesmo,
#    não neste workflow, já que quem chama a IA e comenta é o backend.
# 3. Sem esse secret configurado, o step sai com sucesso sem fazer nada — é
#    o caso do próprio repositório Pr-reviewer, onde este arquivo é só o
#    template-fonte pra ser copiado, não roda contra o próprio código da
#    ferramenta. (NOTA: usar "secrets" direto num "if:" de job/step não é
#    permitido pelo GitHub Actions — quebra o parsing do workflow inteiro;
#    por isso a checagem é feita dentro do script do step.)
